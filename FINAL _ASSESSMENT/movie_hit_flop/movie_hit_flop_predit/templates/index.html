<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Success Predictor</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Animate.css for cool animations -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

</head>
<body class="bg-gradient-to-r from-purple-500 via-pink-500 to-red-500 min-h-screen flex items-center justify-center">

  <div class="bg-white rounded-2xl shadow-2xl p-10 w-full max-w-md animate__animated animate__fadeInDown">
    <h1 class="text-3xl font-bold text-center mb-6 text-gray-800">🎬 Movie Success Predictor</h1>
    
    <form action="/predict" method="post" class="space-y-5">
      <div>
        <label class="block text-gray-700 font-semibold">Budget</label>
        <input type="text" name="Budget" placeholder="Enter budget" 
               class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-400">
      </div>

      <div>
        <label class="block text-gray-700 font-semibold">Duration (mins)</label>
        <input type="text" name="Duration" placeholder="Enter duration"
               class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-400">
      </div>

      <div>
        <label class="block text-gray-700 font-semibold">Cast Rating (1-10)</label>
        <input type="text" name="Cast_Rating" placeholder="Enter cast rating"
               class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-400">
      </div>

      <div>
        <label class="block text-gray-700 font-semibold">Director Rating (1-10)</label>
        <input type="text" name="Director_Rating" placeholder="Enter director rating"
               class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-400">
      </div>

      <button type="submit" 
              class="w-full py-3 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold rounded-xl shadow-lg transform hover:scale-105 transition duration-300">
        Predict 🎯
      </button>
    </form>

    {% if prediction_text %}
    <div class="mt-6 p-4 bg-green-100 border-l-4 border-green-500 rounded-xl animate__animated animate__fadeInUp">
      <p class="text-center text-lg font-semibold text-gray-800">{{ prediction_text }}</p>
    </div>
    {% endif %}
  </div>

</body>
</html>
